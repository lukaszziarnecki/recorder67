name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE & Create Release
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: 'utf-8'
      PYTHONUTF8: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Pytest Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest --tb=short -q

      - name: Build Executable with PyInstaller
        run: |
          python scripts/build_exe.py

      - name: Create Release ZIP Archive
        shell: pwsh
        run: |
          $rawVersion = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          $version = $rawVersion -replace '[/\\:]', '-'
          $zipName = "InteligentnyDyktafonAI-$version-Windows.zip"
          Compress-Archive -Path "dist/InteligentnyDyktafonAI/*" -DestinationPath $zipName -Force
          Write-Host "Utworzono paczke zip: $zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InteligentnyDyktafonAI-Windows
          path: dist/InteligentnyDyktafonAI
          if-no-files-found: error

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build_log
          path: build_log.txt
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}

